<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="animacoes.css">

<body>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(135deg, #140021, #05010d);

            color: white;

            padding: 80px 8%;
        }

        /* TÍTULO */

        .header-title {
            margin-bottom: 60px;
        }

        .header-title h1 {
            font-size: 70px;
            font-weight: 700;
            margin: 0;

            background: linear-gradient(to right, #ffffff, #c084fc);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            margin-bottom: 15px;
        }

        .header-title::after {
            content: '';

            width: 130px;
            height: 4px;

            background: #b76cff;

            display: block;

            border-radius: 50px;

            box-shadow: 0 0 20px #b76cff;
        }

        /* CONTAINER DOS CARDS */

        .container-cards {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(320px, 1fr));

            gap: 30px;
        }

        /* CARD */

        .card {

            background: rgba(255, 255, 255, 0.03);

            border: 1px solid rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-radius: 28px;

            padding: 35px;

            position: relative;

            overflow: hidden;

            transition: 0.4s;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        /* BRILHO */

        .card::before {
            content: '';

            width: 200px;
            height: 200px;

            background:
                radial-gradient(circle, #a855f7 0%, transparent 70%);

            position: absolute;

            top: -120px;
            right: -120px;

            opacity: 0.18;
        }

        .card:hover {
            transform: translateY(-8px);

            border: 1px solid rgba(183, 108, 255, 0.35);

            box-shadow:
                0 0 30px rgba(168, 85, 247, 0.15);
        }

        /* ÍCONE */

        .icon {
            width: 75px;
            height: 75px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 20px;

            background:
                rgba(183, 108, 255, 0.12);

            margin-bottom: 25px;
        }

        .icon i {
            font-size: 30px;
            color: #c084fc;
        }

        /* TEXTO */

        .card h2 {
            font-size: 30px;

            margin-bottom: 20px;

            line-height: 1.3;
        }

        .content-box {
            color: #c7c7c7;

            line-height: 1.8;

            font-size: 15px;
        }

        /* RESPONSIVO */

        @media(max-width:700px) {

            .header-title h1 {
                font-size: 48px;
            }

        }

        @media(max-width:560px) {

            body {
                padding: 50px 5%;
            }

            .header-title {
                margin-bottom: 40px;
            }

            .header-title h1 {
                font-size: 36px;
            }

            .container-cards {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .card {
                padding: 28px;
            }

            .card p {
                font-size: 15px;
                word-break: break-word;
            }

            .icon {
                width: 64px;
                height: 64px;
            }

        }
    </style>


    <header class="header-title">
        <h1>FORMAS DE CONTATO</h1>
    </header>
    <div class="container-cards">
        <div class="card">
            <div class="icon">
                <i class="fa-solid fa-mobile-screen"></i>
            </div>
            <h2>Celular</h2>
            <p> (89)98142-5420</p>
        </div>
        <div class="card">
            <div class="icon">
                <i class="fa-solid fa-envelope"></i>
            </div>
            <h2>E-mail:</h2>
            <p> oliveiradesousa261@gmail.com </p>
        </div>
        <div class="card">
            <div class="icon">
                <i class="fa-brands fa-instagram"></i>
            </div>
            <h2>Instagram:</h2>
            <p> @vtrzin.sz</p>
        </div>
    </div>
    </section>
    </main>
    <script src="animacoes.js"></script>
</body>

</html>
